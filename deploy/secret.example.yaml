apiVersion: v1
kind: Secret
metadata:
  name: weatherstation-db
  namespace: weatherstation
type: Opaque
stringData:
  POSTGRES_DB: REPLACE_ME
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: weatherstation-app
  namespace: weatherstation
type: Opaque
stringData:
  DATABASE_URL: REPLACE_ME
  INGEST_TOKEN: REPLACE_ME
  ADMIN_USER: REPLACE_ME
  ADMIN_PASSWORD: REPLACE_ME
  SESSION_SECRET: REPLACE_ME   # long random string, e.g. openssl rand -hex 32
