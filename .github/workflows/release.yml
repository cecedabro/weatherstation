name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release

jobs:
  migrations:
    uses: ./.github/workflows/migrations.yml

  setup:
    needs: migrations
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - if: ${{ contains(github.event.head_commit.message, '[skip release]') }}
        run: echo "Skipping release (commit contains [skip release])" && exit 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: make check
        run: make setup && make check

      - name: Compute version
        id: version
        run: echo "version=$(python backend/scripts/next_version.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: ${{ needs.setup.outputs.version != '' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.setup.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.setup.outputs.version }}" -m "Release ${{ needs.setup.outputs.version }}"
          git push origin "${{ needs.setup.outputs.version }}"
