[project]
name = "weatherstation-backend"
version = "0.1.0"
description = "Weather station backend: FastAPI app for reading ingestion and serving"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2",
    "pydantic-settings",
    "jinja2",
    "python-multipart",
    "jsonschema",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pgserver",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B017"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.param_functions.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "app"
packages = "app"

[tool.pytest.ini_options]
testpaths = ["tests", "../contract/tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
