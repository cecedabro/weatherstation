<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Weather Station{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Water bubble decorations -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <header class="header">
    <div>
      <h1>{% block header_title %}&#x1F33F; Weather<span>Station</span>{% endblock %}</h1>
    </div>
    <div class="header-logo">{% block header_logo %}&#x1F33B;{% endblock %}</div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    {% block footer %}Weather Station &#x2764;&#xFE0F;{% endblock %}
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
